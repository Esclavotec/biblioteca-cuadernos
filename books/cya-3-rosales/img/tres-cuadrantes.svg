<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220" font-family="Georgia, 'Times New Roman', serif">
<title>A son tres cuadrantes con sus bordes; su complemento es el primer cuadrante abierto</title>
<defs><filter id="lapiz" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8d90" stroke-width="1.3"/></pattern><pattern id="rayas-rojo" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c0322a" stroke-width="1.2" opacity=".7"/></pattern></defs>
<g filter="url(#lapiz)">
<path d="M14 14 H130 V110 H246 V206 H14 Z" fill="url(#rayas)" opacity=".85"/><path d="M14.0 110.0 L246.0 110.0" fill="none" stroke="#4b4e52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M130.0 206.0 L130.0 14.0" fill="none" stroke="#4b4e52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="188.0" y="66.0" font-size="14" fill="#2c3d9c" text-anchor="middle" font-weight="400" font-style="italic">ℝ² − A</text><text x="188.0" y="86.0" font-size="11" fill="#2c3d9c" text-anchor="middle" font-weight="400" font-style="italic">x &gt; 0, y &gt; 0</text><text x="70.0" y="66.0" font-size="16" fill="#4b4e52" text-anchor="middle" font-weight="400" font-style="italic">A</text>
</g>
</svg>
