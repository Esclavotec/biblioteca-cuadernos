<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="300" height="190" font-family="Georgia, 'Times New Roman', serif">
<title>Espacios métricos, normados y de Hilbert</title>
<defs><filter id="lapiz" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8d90" stroke-width="1.3"/></pattern><pattern id="rayas-rojo" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c0322a" stroke-width="1.2" opacity=".7"/></pattern></defs>
<g filter="url(#lapiz)">
<path d="M12.0 12.0 L288.0 12.0 L288.0 178.0 L12.0 178.0 Z" fill="none" stroke="#4b4e52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M74.0 46.0 L274.0 46.0 L274.0 166.0 L74.0 166.0 Z" fill="none" stroke="#4b4e52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M136.0 84.0 L260.0 84.0 L260.0 154.0 L136.0 154.0 Z" fill="none" stroke="#4b4e52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="22.0" y="34.0" font-size="15" fill="#4b4e52" text-anchor="start" font-weight="400" font-style="italic">Métrico</text><text x="84.0" y="68.0" font-size="15" fill="#4b4e52" text-anchor="start" font-weight="400" font-style="italic">Normado</text><text x="150.0" y="124.0" font-size="15" fill="#4b4e52" text-anchor="start" font-weight="400" font-style="italic">Hilbert</text><text x="22.0" y="54.0" font-size="11" fill="#8a8d90" text-anchor="start" font-weight="400" font-style="italic">d(x, y)</text><text x="84.0" y="86.0" font-size="11" fill="#8a8d90" text-anchor="start" font-weight="400" font-style="italic">‖x‖</text><text x="150.0" y="142.0" font-size="11" fill="#8a8d90" text-anchor="start" font-weight="400" font-style="italic">⟨x, y⟩ + completo</text>
</g>
</svg>
