<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210" font-family="Georgia, 'Times New Roman', serif">
<title>Cada cateto es menor o igual que la hipotenusa: |x| ≤ ‖x‖ y |y| ≤ ‖x‖</title>
<defs><filter id="lapiz" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8d90" stroke-width="1.3"/></pattern><pattern id="rayas-rojo" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c0322a" stroke-width="1.2" opacity=".7"/></pattern></defs>
<g filter="url(#lapiz)">
<path d="M20.0 170.0 L262.0 170.0" fill="none" stroke="#8a8d90" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.8 173.5 L262.0 170.0 L254.8 166.5" fill="none" stroke="#8a8d90" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.0 196.0 L50.0 14.0" fill="none" stroke="#8a8d90" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M53.5 21.2 L50.0 14.0 L46.5 21.2" fill="none" stroke="#8a8d90" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.0 170.0 L220.0 50.0" fill="none" stroke="#2c3d9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.0 170.0 L220.0 50.0" fill="none" stroke="#4b4e52" stroke-width="1.6" stroke-dasharray="4.5 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M50.0 50.0 L220.0 50.0" fill="none" stroke="#8a8d90" stroke-width="1.6" stroke-dasharray="4.5 4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220.0" cy="50.0" r="3" fill="#4b4e52"/><text x="226.0" y="44.0" font-size="13" fill="#4b4e52" text-anchor="start" font-weight="400" font-style="italic">(x, y)</text><text x="125.0" y="190.0" font-size="14" fill="#4b4e52" text-anchor="middle" font-weight="400" font-style="italic">|x|</text><text x="228.0" y="115.0" font-size="14" fill="#4b4e52" text-anchor="start" font-weight="400" font-style="italic">|y|</text><text x="96.0" y="98.0" font-size="13" fill="#2c3d9c" text-anchor="middle" font-weight="400" font-style="italic">‖x‖ = √(x² + y²)</text>
</g>
</svg>
