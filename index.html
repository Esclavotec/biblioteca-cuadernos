<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi biblioteca</title>
  <meta name="description" content="Cuadernos de apuntes de mis cursos y un cuaderno de visitas para firmar y dibujar.">
  <meta name="theme-color" content="#e3e4e0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a19" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='3' width='21' height='26' rx='3' fill='%232f5d50'/><rect x='6' y='3' width='4' height='26' fill='%23000' opacity='.2'/><rect x='12' y='11' width='11' height='5' rx='1' fill='%23f4f4f1'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <!-- Iconos: Phosphor (una sola familia) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="css/styles.css?v=1.4.0">
  <!-- Pase de página realista: StPageFlip (MIT). Expone window.St.PageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- Fórmulas matemáticas: KaTeX (MIT). Expone window.katex; si no carga, se ve el código TeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module" src="js/app.js?v=1.4.0"></script>
</head>
<body>
  <!-- Vista principal: la mesa de estudio -->
  <div class="desk-view">
    <header class="topbar">
      <div class="brand">
        <h1>Mi biblioteca</h1>
        <p>Apuntes de los cursos que voy tomando</p>
      </div>
      <label class="search">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <span class="sr-only">Buscar cuaderno</span>
        <input id="search" type="search" placeholder="Buscar cuaderno o curso" autocomplete="off">
      </label>
    </header>

    <main id="desk" class="desk" aria-label="Cuadernos"></main>

    <footer class="desk-foot"><span id="count"></span></footer>
  </div>

  <!-- Aquí se monta el cuaderno abierto (BookViewer) -->
  <div id="viewer-root"></div>
  <!-- Mensajes cortos -->
  <div id="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">Esta biblioteca necesita JavaScript activado.</p></noscript>
</body>
</html>
